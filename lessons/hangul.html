        <h1>認識韓文字母</h1>
        <p>한글 배우기</p>
        <h2>學習目標</h2><p>認識韓文字母的基本組成。</p>
        <h2>課程說明</h2><p>韓文字母由子音與母音組合而成，例如 ㄱ + ㅏ = 가。</p>
        <h2>韓語例句</h2><div class="example"><strong>가</strong><p>ㄱ + ㅏ</p></div><div class="example"><strong>나</strong><p>ㄴ + ㅏ</p></div><div class="example"><strong>마</strong><p>ㅁ + ㅏ</p></div>
        <div class="quiz">
          <h2>小練習 ♡</h2>
          <p>ㄴ + ㅏ 組合後是？</p>
          <button data-answer="false">가</button><button data-answer="true">나</button><button data-answer="false">마</button>
          <p id="result" aria-live="polite"></p>
        </div>
      </div>
