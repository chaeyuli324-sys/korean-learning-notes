        <span class="tag">基礎文法</span>
        <h1>이에요 / 예요</h1>
        <p>기초 한국어 문법</p>
        <h2>學習目標</h2><p>學會韓文的「是……」句型。</p>
        <h2>課程說明</h2><p>名詞有收音時使用 이에요，沒有收音時使用 예요。</p>
        <h2>韓語例句</h2><div class="example"><strong>저는 학생이에요.</strong><p>我是學生。</p></div><div class="example"><strong>저는 의사예요.</strong><p>我是醫生。</p></div><div class="example"><strong>이것은 책이에요.</strong><p>這是書。</p></div>
        <div class="quiz">
          <h2>小練習 ♡</h2>
          <p>「我是醫生」的正確表達是？</p>
          <button data-answer="false">저는 의사이에요.</button><button data-answer="true">저는 의사예요.</button><button data-answer="false">저는 의사입니다요.</button>
          <p id="result" aria-live="polite"></p>
        </div>
      </div>
